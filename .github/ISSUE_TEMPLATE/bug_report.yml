name: Bug report
description: Something does not work as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (a minimal note helps)
  - type: textarea
    id: doctor
    attributes:
      label: Output of `restask doctor` (remove anything private)
      render: shell
  - type: input
    id: env
    attributes:
      label: OS, restask version, Obsidian / Neovim version, CalDAV server
