name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo build --release --locked -p restask
      - name: Package
        run: |
          tar -czf restask-${{ matrix.name }}.tar.gz -C target/release restask
      - uses: actions/upload-artifact@v4
        with:
          name: restask-${{ matrix.name }}
          path: restask-${{ matrix.name }}.tar.gz

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            plugins/obsidian/main.js
            plugins/obsidian/manifest.json
            plugins/obsidian/styles.css

  publish:
    needs: [binaries, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
